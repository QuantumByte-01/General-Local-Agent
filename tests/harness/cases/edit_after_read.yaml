id: edit_after_read
user: Change foo.txt
mode: dont_ask
workspace_files:
  foo.txt: alpha beta gamma
script:
  - tool_calls:
      - name: read_file
        arguments: {path: foo.txt}
  - tool_calls:
      - name: edit_file
        arguments: {path: foo.txt, old_string: beta, new_string: BETA}
  - text: Replaced beta with BETA.
expect:
  terminal: completed
  tools: [read_file, edit_file]
  files:
    foo.txt: alpha BETA gamma
