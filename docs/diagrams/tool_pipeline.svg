<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title">
  <title id="title">Tool execution pipeline</title>
  <rect width="1180" height="360" fill="#f7f8fb"/>
  <text x="590" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Tool execution pipeline</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11">
    <rect x="20" y="56" width="140" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="90" y="86" text-anchor="middle" font-weight="700">1. Lookup</text>
    <text x="90" y="104" text-anchor="middle">by name</text>

    <rect x="180" y="56" width="140" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="250" y="86" text-anchor="middle" font-weight="700">2. Validate</text>
    <text x="250" y="104" text-anchor="middle">JSON schema</text>

    <rect x="340" y="56" width="140" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="410" y="86" text-anchor="middle" font-weight="700">3. PreToolUse</text>
    <text x="410" y="104" text-anchor="middle">hook snapshot</text>

    <rect x="500" y="56" width="140" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="570" y="86" text-anchor="middle" font-weight="700">4. Permission</text>
    <text x="570" y="104" text-anchor="middle">mode + risk</text>

    <rect x="660" y="56" width="140" height="70" rx="10" fill="#ffedd5" stroke="#ea580c"/>
    <text x="730" y="86" text-anchor="middle" font-weight="700">5. Ask user?</text>
    <text x="730" y="104" text-anchor="middle">pause loop</text>

    <rect x="820" y="56" width="140" height="70" rx="10" fill="#ecfdf5" stroke="#059669"/>
    <text x="890" y="86" text-anchor="middle" font-weight="700">6. Partition</text>
    <text x="890" y="104" text-anchor="middle">safe vs serial</text>

    <rect x="980" y="56" width="180" height="70" rx="10" fill="#ecfdf5" stroke="#059669"/>
    <text x="1070" y="86" text-anchor="middle" font-weight="700">7. Execute</text>
    <text x="1070" y="104" text-anchor="middle">fail-closed</text>

    <rect x="180" y="170" width="220" height="56" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="290" y="204" text-anchor="middle" font-weight="700">8. Budget / truncate result</text>

    <rect x="430" y="170" width="220" height="56" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="540" y="204" text-anchor="middle" font-weight="700">9. PostToolUse hook note</text>

    <rect x="680" y="170" width="320" height="56" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="840" y="204" text-anchor="middle" font-weight="700">10. Append tool message in request order</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5">
    <path d="M160 91 H180"/>
    <path d="M320 91 H340"/>
    <path d="M480 91 H500"/>
    <path d="M640 91 H660"/>
    <path d="M800 91 H820"/>
    <path d="M960 91 H980"/>
  </g>
  <rect x="20" y="250" width="1140" height="78" rx="10" fill="#fff" stroke="#9ca3af"/>
  <text x="40" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Concurrency rule</text>
  <text x="40" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#374151">isConcurrencySafe(input) is per-call. Unknown tool, parse failure, or exception � serial.</text>
  <text x="40" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#374151">Results are buffered and released in submission order, not completion order. Source: tool_pipeline.drawio</text>
</svg>
