[project]
name = "general-local-agent"
version = "0.2.0"
description = "Local computer agent: tool loop, permissions, skills, memory, MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.46.0",
    "duckduckgo-search>=6.3.0",
    "gradio>=5.49.1",
    "httpx>=0.27.0",
    "mcp>=1.9.0",
    "pillow>=11.3.0",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "tavily-python>=0.5.0",
    "wmi>=1.5.1; platform_system == 'Windows'",
    "screen-brightness-control>=0.21.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.2", "pytest-asyncio>=0.24.0"]

[project.scripts]
gla = "app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
